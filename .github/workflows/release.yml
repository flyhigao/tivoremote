name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          mkdir -p build/compiled_res build/gen build/classes build/dex
          ANDROID_HOME=$ANDROID_SDK_ROOT
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar

          echo "Using Build Tools: $BUILD_TOOLS"
          echo "Using Platform: $PLATFORM"

          # 1. Compile resources
          $BUILD_TOOLS/aapt2 compile --dir app/src/main/res -o build/compiled_res/resources.zip

          # 2. Link resources
          $BUILD_TOOLS/aapt2 link -o build/unaligned.apk \
            -I $PLATFORM \
            --manifest app/src/main/AndroidManifest.xml \
            --java build/gen \
            build/compiled_res/resources.zip \
            --auto-add-overlay

          # 3. Compile Java
          javac -encoding UTF-8 -d build/classes -cp $PLATFORM build/gen/com/tivo/remote/R.java app/src/main/java/com/tivo/remote/*.java

          # 4. Convert to DEX
          java -cp $BUILD_TOOLS/lib/d8.jar com.android.tools.r8.D8 \
            --output build/dex \
            --lib $PLATFORM \
            build/classes/com/tivo/remote/*.class

          # 5. Add DEX into APK
          cd build/dex && jar -uf ../unaligned.apk classes.dex && cd ../..

          # 6. Align APK
          $BUILD_TOOLS/zipalign -f -p 4 build/unaligned.apk build/TiVoRemote_aligned.apk

          # 7. Generate keystore and sign
          keytool -genkeypair -v -keystore release.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
          java -jar $BUILD_TOOLS/lib/apksigner.jar sign --ks release.keystore --ks-pass pass:android --out TiVoRemote.apk build/TiVoRemote_aligned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: TiVoRemote ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: TiVoRemote.apk
          body: |
            ### TiVoRemote ${{ github.ref_name || 'v1.0.0' }}

            专为 **TiVo Stream 4K** 及通用 Android TV / 电视机顶盒设计的轻量级手机遥控器。

            #### 🆕 本次更新
            - **修复“打字推送变乱码”**：电视端中文输入法（Gboard 拼音）会把注入的英文与 ASCII 标点吞成中文候选字
              （`a.b:c,d?e` → `啊。不：从，但？e`）。现在发送前临时切换到不联想的输入法，发送后自动还原，
              链接 / 拼音 / Wi-Fi 密码可**逐字符原样送达**。
            - **修复影视 / TVBox【配置地址】框改写链接**：该输入框会把开头的单个 `h` / `a` / `f` 自动补全为
              `http://` / `assets://` / `file://`，导致订阅链接变成 `http://ttps://...`；现在自动规避，不残留多余空格。
            - **支持复制粘贴**：打开打字弹窗会**自动填入手机剪贴板内容**，并新增【粘贴】按钮。
            - 文本改走 **Base64** 注入，空格、引号、`&`、`#`、`%s` 等特殊字符全部安全，
              超长文本按电视端输入框上限截断并提示。

            #### ✨ 主要功能：
            - **双模式切换**：支持 Wi-Fi (局域网 ADB) 与 蓝牙 (Bluetooth HID) 双通信模式
            - **完整方向键**：上、下、左、右与大号居中 OK 确认
            - **系统常用控制**：主页 (Home)、返回 (Back)、菜单 (Menu)、音量增加 / 减小
            - **完整 0-9 数字小键盘**：1~9、0、删除，电视换台必备
            - **TiVo 专属键**：一键呼出 TiVo Stream 官方主界面
            - **触感反馈**：按键伴随微弱触感震动反馈
            - **极致轻巧**：无任何商业广告与第三方臃肿 SDK，安装包仅约 42 KB

            #### ℹ️ 使用限制（ADB 注入的固有约束）
            - 打字推送仅支持**英文 / 数字 / ASCII 符号**：电视端 `input text` 无法注入汉字，中文会被忽略（搜中文请发拼音）
            - 发送时电视输入框需处于聚焦状态（光标闪烁）
            - 超长文本会被电视端输入框自身的长度上限截断（App 会提示实际发送字符数）
